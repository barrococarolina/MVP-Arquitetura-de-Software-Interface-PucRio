<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento Escolar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <span class="eyebrow">Projeto MVP Puc Rio</span>
      <h1>Gerenciamento Escolar</h1>
      <p>Cadastre turmas e alunos, consulte endereços pelo CEP e acompanhe as informações em um único lugar.</p>
    </div>
    <img src="img/imagem.jpg" alt="Ilustração de uma sala de aula">
  </header>

  <main>
    <section class="card">
      <div class="section-heading">
        <div>
          <span class="eyebrow">01</span>
          <h2>Turmas</h2>
        </div>
        <span id="statusTurma" class="status"></span>
      </div>

      <form id="formTurma" class="form-grid">
        <input type="hidden" id="idTurmaEdicao">
        <label>
          Nome da turma
          <input type="text" id="nomeTurma" placeholder="Ex.: Engenharia de Software" required maxlength="140">
        </label>
        <label>
          Situação
          <select id="turmaAtiva">
            <option value="true">Ativa</option>
            <option value="false">Inativa</option>
          </select>
        </label>
        <div class="form-actions">
          <button type="submit" id="btnSalvarTurma">Cadastrar turma</button>
          <button type="button" class="secondary hidden" id="btnCancelarTurma">Cancelar edição</button>
        </div>
      </form>

      <div class="table-wrapper">
        <table>
          <thead><tr><th>ID</th><th>Turma</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody id="listaTurmas"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="section-heading">
        <div>
          <span class="eyebrow">02</span>
          <h2>Alunos</h2>
        </div>
        <span id="statusAluno" class="status"></span>
      </div>

      <form id="formAluno" class="form-grid">
        <input type="hidden" id="idAlunoEdicao">
        <label>
          Nome
          <input type="text" id="nomeAluno" placeholder="Nome completo" required maxlength="140">
        </label>
        <label>
          E-mail
          <input type="email" id="emailAluno" placeholder="aluno@email.com" required maxlength="255">
        </label>
        <label>
          Faltas
          <input type="number" id="faltasAluno" min="0" value="0" required>
        </label>
        <label>
          Turma
          <select id="turmaIdAluno" required></select>
        </label>
        <label>
          CEP
          <input type="text" id="cepAluno" placeholder="00000-000" maxlength="9" required>
        </label>
        <div class="address-preview" id="enderecoPreview">O endereço será preenchido automaticamente pelo ViaCEP.</div>
        <div class="form-actions">
          <button type="submit" id="btnSalvarAluno">Cadastrar aluno</button>
          <button type="button" class="secondary hidden" id="btnCancelarAluno">Cancelar edição</button>
        </div>
      </form>

      <div class="filters">
        <input type="search" id="buscaAluno" placeholder="Buscar por nome ou e-mail">
        <select id="filtroTurma"><option value="">Todas as turmas</option></select>
        <select id="ordenacaoAluno">
          <option value="nome">Ordenar por nome</option>
          <option value="faltas_desc">Mais faltas primeiro</option>
        </select>
        <button type="button" class="secondary" id="btnBuscar">Buscar</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead><tr><th>ID</th><th>Aluno</th><th>Turma</th><th>Faltas</th><th>Endereço</th><th>Ações</th></tr></thead>
          <tbody id="listaAlunos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="scripts.js"></script>
</body>
</html>
